# ============================================================================
#  Configuration « LUXE » : cible les articles de luxe les plus rentables
# ============================================================================
# Copiez ce fichier en `config.yaml` (puis `python main.py verifier`). Mêmes explications que config.exemple.yaml.
#
# ⚠️ LE LUXE EST LA CATÉGORIE LA PLUS CONTREFAITE DE VINTED. Un article « authentique » vendu très en dessous du marché est,
# le plus souvent, un faux. Le bot ne peut PAS authentifier : il calcule seulement un écart de prix. Garde-fous ici :
#   • prix plancher par veille (en dessous, probablement faux : valeurs indicatives, à ajuster selon votre expérience) ;
#   • au moins 6 photos (étiquettes, coutures, numéro de série visibles) ;
#   • mots écartés : replica, fake, « type », « inspired »… ;
#   • chaque alerte porte l'avertissement ⚠️ « souvent contrefaite ».
# Avant d'acheter : examinez toutes les photos, demandez justificatif d'achat et photos des détails, et privilégiez les
# articles pour lesquels Vinted propose un service d'authentification. À défaut, abstenez-vous.
#
# « Peu importe la marque » : Vinted ne se surveille pas sans mot-clé de marque de façon fiable (le prix de revente est estimé par
# marque, état et taille). Cette liste couvre les maisons de luxe les plus revendues ; ajoutez les vôtres dans marques.yaml.
#
# PRIX DE REVENTE : estimé par le bot (médiane des prix demandés × 0,85) dès 8 références comparables ; aucun prix inventé.
# Les budgets (`prix_max`) sont des exemples : ajustez-les à ce que vous pouvez investir.
#
# TRAFIC : une quinzaine de veilles, une lecture chacune toutes les 3 min. Retirez celles qui ne vous intéressent pas.

discord:
  actif: false
telegram:
  actif: true

domaine: vinted.fr
intervalle_secondes: 180
pages_amorcage: 2

# Tri sévère : le luxe est cher et très contrefait, on ne signale que les écarts de prix nets, sur des références solides.
revente:
  min_references: 8

defauts_veille:
  port_estime: 8
  marge_min: 60
  score_min: 70

veilles:
  - nom: Louis Vuitton sacs
    mots_cles: [louis vuitton, sac]
    prix_min: 150
    prix_max: 700
    photos_min: 6
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, replica, copie]
