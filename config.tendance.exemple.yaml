# ============================================================================
#  Configuration « marques tendance » : marques qui se revendent vite, peu contrefaites
# ============================================================================
# Copiez ce fichier en `config.yaml` (puis `python main.py verifier`). Tout ce qui n'est pas écrit ici prend la
# valeur par défaut ; les secrets restent dans `.env`. Mêmes explications que dans config.exemple.yaml.
#
# CHOIX DES MARQUES (connaissance générale du marché de la seconde main, NON vérifiée par le bot : à confirmer
# avec votre propre expérience de revente) :
#   • très connues en France, forte revente : Ralph Lauren, Carhartt, Patagonia, Barbour, Levi's 501, Fred Perry,
#     Saint James ;
#   • aussi très recherchées mais SOUVENT CONTREFAITES (avec garde-fous et avertissement) : Lacoste, The North Face,
#     Supreme ;
#   • aussi demandées et très contrefaites, avec garde-fous renforcés (≥ 5 photos, prix plancher) : Stone Island,
#     Burberry, Gucci ;
#   • volontairement ABSENTES (faux massifs) : CP Company, Moncler, Louis Vuitton, Stüssy, Off-White. À vos risques.
#   Le bot écarte déjà les annonces contenant « replica », « fake », « type », « inspired »…, mais ne peut pas
#   authentifier un article : vérifiez toujours photos, étiquettes et vendeur avant d'acheter.
#
# PRIX DE REVENTE : aucun `prix_revente_cible` n'est fixé ici (je n'invente pas de prix de marché). Le bot estime la
# revente à partir des prix demandés qu'il observe (médiane × 0,85, par marque, état et taille — élargi à « toutes
# tailles » s'il manque d'exemples) et n'alerte qu'une fois 5 références réunies (réglage `revente.min_references`) ;
# elles sont réunies dès le premier passage pour les recherches populaires. Pour alerter plus tôt, ajoutez un `prix_revente_cible` réaliste.
#
# TRAFIC : chaque veille lit une page de plusieurs Mo à chaque passage. une quinzaine de veilles toutes les 3 minutes, c'est
# beaucoup : retirez celles qui ne vous intéressent pas, ou allongez `intervalle_secondes`.

# Alertes sur le téléphone avec Telegram SEUL (voir README, section « Telegram ») : il faut TELEGRAM_BOT_TOKEN et
# TELEGRAM_CHAT_ID dans .env. Pour utiliser Discord à la place, mettez discord.actif à true et telegram.actif à false.
discord:
  actif: false
telegram:
  actif: true

domaine: vinted.fr
intervalle_secondes: 180
pages_amorcage: 2

# Réglages « super affaires seulement » : score d'au moins 85 (palier 🔥 dès 80), marge nette d'au moins 35 €, 5 références minimum.
# Pour recevoir plus d'alertes (moins sélectives), baissez marge_min et score_min (ex. 10 et 60).
revente:
  min_references: 5

defauts_veille:
  port_estime: 5
  marge_min: 35
  score_min: 85

veilles:
  # --- Ralph Lauren ----------------------------------------------------------
  - nom: Ralph Lauren pulls
    mots_cles: [ralph lauren, pull]
    prix_max: 35
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior, bebe]
  - nom: Ralph Lauren polos
    mots_cles: [ralph lauren, polo]
    prix_max: 25
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior, bebe]
  - nom: Ralph Lauren vestes
    mots_cles: [ralph lauren, veste]
    prix_max: 50
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior, bebe]

  # --- Carhartt --------------------------------------------------------------
  - nom: Carhartt vestes
    mots_cles: [carhartt, veste]
    prix_max: 50
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior]
    variantes_marque: true         # cherche aussi « carhart », « carharrt »… (3 requêtes en plus : retirez si trop lourd)
  - nom: Carhartt sweats
    mots_cles: [carhartt, sweat]
    prix_max: 35
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior]

  # --- Patagonia -------------------------------------------------------------
  - nom: Patagonia polaires
    mots_cles: [patagonia, polaire]
    prix_max: 50
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior]
  - nom: Patagonia vestes
    mots_cles: [patagonia, veste]
    prix_max: 70
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior]

  # --- Autres classiques -----------------------------------------------------
  - nom: Barbour vestes
    mots_cles: [barbour, veste]
    prix_max: 70
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior]
  - nom: Levis 501
    mots_cles: [levis, 501]
    prix_max: 30
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior]
  - nom: Fred Perry polos
    mots_cles: [fred perry, polo]
    prix_max: 30
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior]
  - nom: Saint James marinieres
    mots_cles: [saint james, mariniere]
    prix_max: 30
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior]

  # --- Très connues en France mais SOUVENT CONTREFAITES : garde-fous (au moins 4 photos, prix plancher) -----------
  # Le bot n'authentifie rien : les alertes portent un avertissement ⚠️. Ajustez prix_min/prix_max à votre connaissance
  # du marché ; un prix très bas pour la marque est le signe le plus courant d'un faux.
  - nom: Lacoste polos
    mots_cles: [lacoste, polo]
    prix_min: 12
    prix_max: 35
    photos_min: 4
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior, bebe]
  - nom: The North Face vestes
    mots_cles: [the north face, veste]
    prix_min: 40
    prix_max: 110
    photos_min: 4
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior, bebe]
  - nom: Supreme hauts
    mots_cles: [supreme, sweat]
    prix_min: 60          # en dessous, un sweat Supreme est très probablement faux
    prix_max: 220
    photos_min: 5
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior, replica]
  - nom: Stone Island pulls
    mots_cles: [stone island, pull]
    prix_min: 70          # estimation : en dessous, très probablement faux
    prix_max: 220
    photos_min: 5         # étiquette, badge amovible et coutures doivent être visibles
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior, replica]
  - nom: Burberry polos et pulls
    mots_cles: [burberry, polo]
    prix_min: 40
    prix_max: 140
    photos_min: 5
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, junior, replica, echarpe]
  - nom: Gucci ceintures
    mots_cles: [gucci, ceinture]
    prix_min: 80          # les ceintures et sacs Gucci sont parmi les articles les plus contrefaits
    prix_max: 300
    photos_min: 6
    etats: [neuf_avec_etiquette, neuf_sans_etiquette, tres_bon_etat]
    mots_exclus: [enfant, replica]
