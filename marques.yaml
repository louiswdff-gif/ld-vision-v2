# ============================================================================
#  Variantes d'orthographe des marques (détection des annonces « pépites »)
# ============================================================================
# Une annonce dont la marque est mal écrite (ou absente du champ « marque » mais présente dans
# le titre / la description) est moins vue des acheteurs : le bot la signale et lui ajoute un bonus.
#
#   nom canonique :  [variante, variante, …]
#
# - Les accents, majuscules et ponctuation sont ignorés (« Stüssy » = « stussy »).
# - En plus de cette liste, le bot détecte les fautes de frappe proches par fuzzy matching
#   (réglages `marques.seuil_fuzzy` et `marques.longueur_min_mot` dans config.yaml) :
#   « carharrt » est reconnu même s'il n'est pas listé ici.
# - Pour désactiver le fuzzy sur une marque trop proche d'un mot courant, utilisez la forme longue :
#       diesel:
#         variantes: [diezel]
#         fuzzy: false
# - `scanner: false` : la marque reste DÉTECTÉE (titres, fautes d'orthographe) mais `python main.py marques-ids` ne la
#   propose pas par défaut pour la surveillance, car elle est très contrefaite en occasion (jugement général, à
#   corriger selon votre expérience ; `marques-ids --toutes` les inclut).
# - `risque_faux: true` : marque souvent contrefaite ; les alertes sur ces marques portent un AVERTISSEMENT visible
#   (il ne change ni le score ni la décision d'alerter). Le bot n'authentifie rien : vérifiez photos, étiquettes, vendeur.
# - Ajoutez librement vos marques : un nom par ligne.

